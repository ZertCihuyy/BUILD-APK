name: Build and Release Private Repo APK

on:
  workflow_dispatch: # Supaya ada tombol 'Run workflow' manual
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    # 1. Checkout Repo Private CIHUYNIME-TV pakai Secret Token
    - name: Checkout Private Repository
      uses: actions/checkout@v4
      with:
        repository: 'ZertCihuyy/CIHUYNIME-TV'
        token: ${{ secrets.MY_PAT }}
        ref: 'main'

    # 2. Setup JDK 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # 3. Chmod Gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Build APK
    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    # 5. Upload APK ke Artifacts
    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CIHUYNIME-TV-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    # 6. Publish ke Halaman Releases Repo Public
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: release-v${{ github.run_number }}
        name: "CIHUYNIME-TV Build v${{ github.run_number }}"
        body: "Automated build of CIHUYNIME-TV from private repository."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
