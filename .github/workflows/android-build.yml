name: Build and Release Private Repo APK

on:
  workflow_dispatch: # Jalankan manual lewat tombol 'Run workflow' di tab Actions
  push:
    branches: [ "main" ] # Otomatis build kalau ada push ke repo public ini

jobs:
  build:
    runs-on: ubuntu-latest # Runner Public (Gratis & Bebas Limit Billing)

    permissions:
      contents: write # Wajib agar Action bisa otomatis membuat Release & upload APK

    steps:
    # 1. Checkout Repository Private CIHUYNIME-TV menggunakan Personal Access Token (PAT)
    - name: Checkout Private Repository
      uses: actions/checkout@v4
      with:
        repository: 'ZertCihuyy/CIHUYNIME-TV'
        token: ${{ secrets.MY_PAT }}
        ref: 'main' # Sesuaikan jika nama branch utamamu 'master'

    # 2. Setup Lingkungan JDK 21 (Temurin)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # 3. Beri Izin Eksekusi untuk Gradle Wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Compile APK (assembleDebug)
    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    # 5. Upload APK ke Tab Artifacts (Bisa di-download sementara di halaman Run Summary)
    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CIHUYNIME-TV-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    # 6. Otomatis Publish APK ke Halaman GitHub Releases Repo Public Ini
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: build-v${{ github.run_number }}
        name: "CIHUYNIME-TV Build v${{ github.run_number }}"
        body: "Automated build of CIHUYNIME-TV from private repository."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
