name: Build Private Repo APK

on:
  workflow_dispatch: # Tinggal klik tombol 'Run workflow' dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest # Gratis & tanpa limit karena reponya Public!

    steps:
    # 1. Checkout Repo Private menggunakan Personal Access Token
    - name: Checkout Private Repository
      uses: actions/checkout@v4
      with:
        repository: 'ZertCihuyy/CIHUYNIME-TV'
        token: ${{ secrets.MY_PAT }}
        ref: 'main' # Ganti kalau nama branch utamamu 'master'

    # 2. Setup JDK 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # 3. Chmod Gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Build APK
    - name: Build APK
      run: ./gradlew assembleDebug

    # 5. Upload APK ke Artifacts
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CIHUYNIME-TV-debug
        path: app/build/outputs/apk/debug/app-debug.apk
